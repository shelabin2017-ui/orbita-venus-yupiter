services:
  bot:
    build: .
    env_file: .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-${ORBITA_BOT_TOKEN:-}}
      ADMIN_IDS: ${ADMIN_IDS:-${ORBITA_ADMIN_IDS:-}}
      PHOTO_MODERATION_ENABLED: ${PHOTO_MODERATION_ENABLED:-false}
      PHOTO_MODERATION_API_KEY: ${PHOTO_MODERATION_API_KEY:-${ORBITA_OPENAI_API_KEY:-}}
      PHOTO_MODERATION_MODEL: ${PHOTO_MODERATION_MODEL:-gpt-5.6-luna}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [backups:/backups]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [backups:/backups]
    entrypoint: ["/bin/sh","-c"]
    command: >-
      while true; do
        STAMP=$$(date -u +%Y-%m-%d_%H-%M-%S);
        pg_dump --format=custom --no-owner --no-acl > "/backups/orbita_$$STAMP.dump";
        find /backups -type f -name 'orbita_*.dump' -mtime +14 -delete;
        sleep 86400;
      done
    depends_on: {postgres: {condition: service_healthy}}

volumes:
  pgdata: {}
  redisdata: {}
  backups: {}
