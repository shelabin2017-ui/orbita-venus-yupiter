name: Smoke test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbita
          POSTGRES_USER: orbita
          POSTGRES_PASSWORD: orbita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbita -d orbita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://orbita:orbita@localhost:5432/orbita
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_DB: orbita
      POSTGRES_USER: orbita
      POSTGRES_PASSWORD: orbita
      BOT_TOKEN: test-token
      ADMIN_IDS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile application
        run: python -m compileall -q app
      - name: Apply migrations
        run: alembic upgrade head
      - name: Runtime import tests
        run: pytest -q
